
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TP 計算器</title>
    <style>
        .label-banker { color: red; font-weight: bold; }
        .label-player { color: blue; font-weight: bold; }
        body { font-family: Arial, sans-serif; padding: 20px; background-color: #f2f2f2; }
        h2 { text-align: center; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        td, th { padding: 10px; text-align: center; }
        input { width: 60px; padding: 5px; font-size: 1em; text-align: center; }
        .btn { padding: 10px 20px; margin: 10px; font-size: 1em; }
        .result { font-weight: bold; }
    
        .hv_col, .ag_col { display: none; }
    
</head>
<body>
    <h2>TP 計算器</h2>
    <table border="1">
        <tr>
            <th class="label-banker">上局莊</th><th><input type="number" id="up_b_1"></th><th><input type="number" id="up_b_2"></th><th><input type="number" id="up_b_3"></th>
        </tr>
        <tr>
            <th class="label-banker">本局莊</th><th><input type="number" id="cur_b_1"></th><th><input type="number" id="cur_b_2"></th><th><input type="number" id="cur_b_3"></th>
        </tr>
        <tr>
            <th class="label-player">上局閒</th><th><input type="number" id="up_p_1"></th><th><input type="number" id="up_p_2"></th><th><input type="number" id="up_p_3"></th>
        </tr>
        <tr>
            <th class="label-player">本局閒</th><th><input type="number" id="cur_p_1"></th><th><input type="number" id="cur_p_2"></th><th><input type="number" id="cur_p_3"></th>
        </tr>
    </table>

    <div style="text-align:center;">
        <button class="btn" onclick="transfer()">轉上局</button>
        <button class="btn" onclick="clearCurrent()">清空本局</button>
    </div>

    
    <button class="btn" onclick="toggleDetails()">顯示/隱藏 HV 與 AG</button>
    <table border="1" id="resultTable">
        <tr>
            <th></th><th class="hv_col">HV</th><th class="ag_col">AG</th><th>TP</th>
        </tr>
        <tr>
            <th class="label-banker">莊</th>
            <td id="hv_b" class="result"></td>
            <td id="ag_b" class="result"></td>
            <td id="tp_b" class="result"></td>
        </tr>
        <tr>
            <th class="label-player">閒</th>
            <td id="hv_p" class="result"></td>
            <td id="ag_p" class="result"></td>
            <td id="tp_p" class="result"></td>
        </tr>
    </table>

    <script>
        const hvTable = {0:0, 1:2, 2:1, 3:3, 4:2, 5:1, 6:2, 7:3, 8:2, 9:2};
        const agTable = {0:0, 1:1, 2:2, 3:2, 4:3, 5:4, 6:3, 7:2, 8:1, 9:1};

        function getMax(inputs) {
            return Math.max(...inputs.map(n => isNaN(n) ? 0 : n));
        }

        function getSum(inputs) {
            const sum = inputs.reduce((a, b) => a + (isNaN(b) ? 0 : b), 0);
            if (sum === 10 || sum === 20) return 0;
            if (sum > 20) return sum - 20;
            if (sum > 10) return sum - 10;
            return sum;
        }

        function calcTP(hv, ag) {
            if (ag === 0) return "錯誤";
            return (hv / ag).toFixed(1);
        }

        function calculate() {
            const up_b = [1,2,3].map(i => parseInt(document.getElementById('up_b_' + i).value));
            const cur_b = [1,2,3].map(i => parseInt(document.getElementById('cur_b_' + i).value));
            const up_p = [1,2,3].map(i => parseInt(document.getElementById('up_p_' + i).value));
            const cur_p = [1,2,3].map(i => parseInt(document.getElementById('cur_p_' + i).value));

            const max_b = getMax(cur_b);
            const max_p = getMax(cur_p);
            const hv_b = hvTable[max_b] ?? 0;
            const hv_p = hvTable[max_p] ?? 0;

            const sum_b_cur = getSum(cur_b);
            const sum_b_up  = getSum(up_b);
            const sum_p_cur = getSum(cur_p);
            const sum_p_up  = getSum(up_p);

            const diff_b = Math.abs(sum_b_cur - sum_b_up);
            const diff_p = Math.abs(sum_p_cur - sum_p_up);

            const ag_b = agTable[diff_b] ?? 0;
            const ag_p = agTable[diff_p] ?? 0;

            const tp_b = calcTP(hv_b, ag_b);
            const tp_p = calcTP(hv_p, ag_p);

            document.getElementById("hv_b").textContent = hv_b;
            document.getElementById("ag_b").textContent = ag_b;
            document.getElementById("tp_b").textContent = tp_b;
            document.getElementById("hv_p").textContent = hv_p;
            document.getElementById("ag_p").textContent = ag_p;
            document.getElementById("tp_p").textContent = tp_p;
        }

        function transfer() {
            [1,2,3].forEach(i => {
                document.getElementById('up_b_' + i).value = document.getElementById('cur_b_' + i).value;
                document.getElementById('up_p_' + i).value = document.getElementById('cur_p_' + i).value;
            });
            clearCurrent();
            calculate();
        }

        function clearCurrent() {
            [1,2,3].forEach(i => {
                document.getElementById('cur_b_' + i).value = '';
                document.getElementById('cur_p_' + i).value = '';
            });
            calculate();
        }

        document.querySelectorAll('input').forEach(el => {
            el.addEventListener('input', calculate);
        });
    
        function toggleDetails() {
            const hvCols = document.querySelectorAll('.hv_col');
            const agCols = document.querySelectorAll('.ag_col');
            hvCols.forEach(col => {
                col.style.display = (col.style.display === 'none') ? 'table-cell' : 'none';
            });
            agCols.forEach(col => {
                col.style.display = (col.style.display === 'none') ? 'table-cell' : 'none';
            });
        }
    
        // 加入輸入驗證：大於 9 的格子標紅
        function validateInputs() {
            document.querySelectorAll("input[type='number']").forEach(input => {
                const val = parseInt(input.value);
                if (!isNaN(val) && val > 9) {
                    input.style.backgroundColor = "#ffcccc";
                } else {
                    input.style.backgroundColor = "white";
                }
            });
        }

        // 修改所有 input 綁定事件，增加驗證邏輯
        document.querySelectorAll('input').forEach(el => {
            el.addEventListener('input', () => {
                calculate();
                validateInputs();
            });
        });

        // 初次載入也驗證一次
        validateInputs();
    </script>



    <div style="text-align:center; margin-top: 30px;">
        <button class="btn" onclick="exportCSV()">匯出紀錄 CSV</button>
        <button class="btn" onclick="clearHistory()">清空紀錄</button>
    </div>
    <table border="1" id="historyTable" style="margin-top: 20px; width: 100%;">
        <thead>
            <tr>
                <th colspan="3" class="label-banker">本局莊</th>
                <th colspan="3" class="label-player">本局閒</th>
            </tr>
        </thead>
        <tbody id="historyBody"></tbody>
    </table>

    <script>
        function saveHistory() {
            const cur_b = [1,2,3].map(i => document.getElementById('cur_b_' + i).value || 0);
            const cur_p = [1,2,3].map(i => document.getElementById('cur_p_' + i).value || 0);
            const record = [...cur_b, ...cur_p];
            let history = JSON.parse(localStorage.getItem("tp_history") || "[]");
            history.push(record);
            localStorage.setItem("tp_history", JSON.stringify(history));
            renderHistory();
        }

        function renderHistory() {
            let history = JSON.parse(localStorage.getItem("tp_history") || "[]");
            let body = document.getElementById("historyBody");
            body.innerHTML = "";
            history.forEach(row => {
                let tr = "<tr>" + row.map(val => `<td>${val}</td>`).join("") + "</tr>";
                body.innerHTML += tr;
            });
        }

        function exportCSV() {
            let history = JSON.parse(localStorage.getItem("tp_history") || "[]");
            let csvContent = "本局莊1,本局莊2,本局莊3,本局閒1,本局閒2,本局閒3\n";
            history.forEach(row => {
                csvContent += row.join(",") + "\n";
            });
            const blob = new Blob([csvContent], { type: "text/csv;charset=utf-8;" });
            const url = URL.createObjectURL(blob);
            const link = document.createElement("a");
            link.setAttribute("href", url);
            link.setAttribute("download", "TP_紀錄.csv");
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        function clearHistory() {
            localStorage.removeItem("tp_history");
            renderHistory();
        }

        // 修改 calculate 函數，讓它每次重新輸入都儲存
        const originalCalculate = calculate;
        calculate = function() {
            originalCalculate();
            saveHistory();
        };

        renderHistory();
    
        // 加入輸入驗證：大於 9 的格子標紅
        function validateInputs() {
            document.querySelectorAll("input[type='number']").forEach(input => {
                const val = parseInt(input.value);
                if (!isNaN(val) && val > 9) {
                    input.style.backgroundColor = "#ffcccc";
                } else {
                    input.style.backgroundColor = "white";
                }
            });
        }

        // 修改所有 input 綁定事件，增加驗證邏輯
        document.querySelectorAll('input').forEach(el => {
            el.addEventListener('input', () => {
                calculate();
                validateInputs();
            });
        });

        // 初次載入也驗證一次
        validateInputs();
    </script>

    </body>
</html>

</html>
