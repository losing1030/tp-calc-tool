
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <title>TP 工具（穩定最終版）</title>
    <style>
        body { font-family: Arial; padding: 20px; }
        table { border-collapse: collapse; margin-bottom: 20px; }
        td, th {
            width: 50px;
            height: 40px;
            border: 1px solid #000;
            text-align: center;
            font-size: 18px;
        }
        input {
            width: 48px;
            height: 38px;
            font-size: 18px;
            text-align: center;
            border: none;
        }
        .label-banker { background-color: #fdd; color: red; font-weight: bold; }
        .label-player { background-color: #ddf; color: blue; font-weight: bold; }
        .result-box { font-size: 20px; margin-top: 10px; }
        .red-btn, .green-btn {
            font-size: 18px; padding: 10px 20px; margin: 10px;
            border: 2px solid #000; border-radius: 5px; font-weight: bold;
        }
        .red-btn { background-color: red; color: white; }
        .green-btn { background-color: limegreen; color: black; }
    </style>
</head>
<body>
    <h2>TP 工具（依圖片表格）</h2>
    <table>
        <tr>
            <th class="label-player">閒上局</th>
            <th colspan="3"></th>
            <th class="label-banker">莊上局</th>
            <th colspan="3"></th>
        </tr>
        <tr>
            <td></td>
            <td><input id="up_p_1" type="text"></td>
            <td><input id="up_p_2" type="text"></td>
            <td><input id="up_p_3" type="text"></td>
            <td></td>
            <td><input id="up_b_1" type="text"></td>
            <td><input id="up_b_2" type="text"></td>
            <td><input id="up_b_3" type="text"></td>
        </tr>
        <tr>
            <th class="label-player">閒本局</th>
            <th colspan="3"></th>
            <th class="label-banker">莊本局</th>
            <th colspan="3"></th>
        </tr>
        <tr>
            <td></td>
            <td><input id="cur_p_1" type="text"></td>
            <td><input id="cur_p_2" type="text"></td>
            <td><input id="cur_p_3" type="text"></td>
            <td></td>
            <td><input id="cur_b_1" type="text"></td>
            <td><input id="cur_b_2" type="text"></td>
            <td><input id="cur_b_3" type="text"></td>
        </tr>
    </table>

    <div class="result-box">
        <span class="label-player">閒 TP：</span> <span id="tp_p">-</span>
        &nbsp;&nbsp;&nbsp;&nbsp;
        <span class="label-banker">莊 TP：</span> <span id="tp_b">-</span>
    </div>

    <button class="red-btn" onclick="clearInputs()">刪除</button>
    <button class="green-btn" onclick="transfer()">轉上局</button>

    <script>
        const hvTable = {
            0: -2, 1: 9, 2: 8, 3: 7, 4: 6, 5: 5,
            6: 1, 7: 3, 8: 2, 9: 2
        };

        const agTable = {
            0: -4, 1: -5, 2: -5, 3: -2, 4: -1, 5: -1,
            6: 3, 7: 4, 8: 5, 9: 6
        };

        function parse(id) {
            const val = parseInt(document.getElementById(id).value);
            return isNaN(val) ? 0 : val;
        }

        function getMax(ids) {
            return Math.max(...ids.map(id => parse(id)));
        }

        function getSum(ids) {
            const sum = ids.map(id => parse(id)).reduce((a,b)=>a+b,0);
            if (sum === 10 || sum === 20) return 0;
            if (sum > 20) return sum - 20;
            if (sum > 10) return sum - 10;
            return sum;
        }

        function calcTP(hv, ag) {
            if (ag === 0) return "錯誤";
            return (hv / ag).toFixed(1);
        }

        function calculate() {
            const cur_b = ["cur_b_1", "cur_b_2", "cur_b_3"];
            const up_b = ["up_b_1", "up_b_2", "up_b_3"];
            const cur_p = ["cur_p_1", "cur_p_2", "cur_p_3"];
            const up_p = ["up_p_1", "up_p_2", "up_p_3"];

            const hv_b = hvTable[getMax(cur_b)] ?? 0;
            const ag_b = agTable[Math.abs(getSum(cur_b) - getSum(up_b))] ?? 0;

            const hv_p = hvTable[getMax(cur_p)] ?? 0;
            const ag_p = agTable[Math.abs(getSum(cur_p) - getSum(up_p))] ?? 0;

            document.getElementById("tp_b").textContent = calcTP(hv_b, ag_b);
            document.getElementById("tp_p").textContent = calcTP(hv_p, ag_p);
        }

        
function transfer() {
    const cur_b_vals = ["1", "2", "3"].map(i => document.getElementById("cur_b_" + i).value || "0");
    const cur_p_vals = ["1", "2", "3"].map(i => document.getElementById("cur_p_" + i).value || "0");

    const b_sum = cur_b_vals.map(Number).reduce((a,b)=>a+b,0);
    const p_sum = cur_p_vals.map(Number).reduce((a,b)=>a+b,0);

    let resultText = "";
    if (b_sum > p_sum) {
        resultText = "莊勝";
    } else if (b_sum < p_sum) {
        resultText = "閒勝";
    } else {
        resultText = "合";
    }

    const display = `莊：${cur_b_vals.join(" ")}，閒：${cur_p_vals.join(" ")} → ${resultText}`;
    
    const historyDiv = document.getElementById("last_result");
    const newEntry = document.createElement("div");
    
    const resultSpan = document.createElement("span");
    resultSpan.textContent = display;
    if (resultText.includes("莊")) resultSpan.style.color = "red";
    if (resultText.includes("閒")) resultSpan.style.color = "blue";
    if (resultText.includes("合")) resultSpan.style.color = "green";
    newEntry.appendChild(resultSpan);

    historyDiv.prepend(newEntry);



            ["1","2","3"].forEach(i => {
                document.getElementById("up_b_" + i).value = document.getElementById("cur_b_" + i).value;
                document.getElementById("up_p_" + i).value = document.getElementById("cur_p_" + i).value;
                document.getElementById("cur_b_" + i).value = "";
                document.getElementById("cur_p_" + i).value = "";
            });
            calculate();
        }

        function clearInputs() {
            document.querySelectorAll("input").forEach(input => input.value = "");
            calculate();
        }

        document.querySelectorAll("input").forEach(el => {
            el.addEventListener("input", calculate);
        });
    
    // 輸入驗證與重新計算
    function validateInputs() {
        document.querySelectorAll("input").forEach(input => {
            const val = parseInt(input.value);
            if (!isNaN(val) && val >= 10) {
                input.style.backgroundColor = "#ffcccc"; // 過高變紅
            } else {
                input.style.backgroundColor = "white";
            }
        });
    }

    // 綁定事件：每次輸入都觸發計算與驗證
    document.querySelectorAll("input").forEach(el => {
        el.addEventListener("input", () => {
            calculate();
            validateInputs();
        });
    });

    // 初次載入觸發
    validateInputs();
    calculate();

    // 自動選取格子內文字
    document.querySelectorAll("input").forEach(el => {
        el.addEventListener("focus", function() {
            this.select();
        });
    });

    // 額外顯示最大 TP 值
    function showMaxTP() {
        const tp_b = document.getElementById("tp_b").textContent;
        const tp_p = document.getElementById("tp_p").textContent;
        let maxText = "-";
        const num_b = parseFloat(tp_b);
        const num_p = parseFloat(tp_p);

        if (!isNaN(num_b) && !isNaN(num_p)) {
            maxText = (Math.abs(num_b) >= Math.abs(num_p)) ? tp_b : tp_p;
        } else if (!isNaN(num_b)) {
            maxText = tp_b;
        } else if (!isNaN(num_p)) {
            maxText = tp_p;
        }

        document.getElementById("tp_max").textContent = maxText;
    }

    // 修改 TP 顯示後，同步比較最大 TP
    const originalCalcTP = calcTP;
    calcTP = function(hv, ag) {
        const result = hv / ag;
        const formatted = isNaN(result) || !isFinite(result) ? result.toString() : result.toFixed(1);
        setTimeout(showMaxTP, 10); // 延遲比較
        return formatted;
    };

    // 顯示最大 TP 結果區塊
    const resultDiv = document.querySelector(".result-box");
    const maxTPElement = document.createElement("p");
    maxTPElement.innerHTML = '<strong>最大 TP：</strong><span id="tp_max">-</span>';
    resultDiv.appendChild(maxTPElement);
</script>



    
    <div style="position: absolute; right: 20px; top: 120px; width: 280px;">
        <h3>上轉記錄</h3>
        <div id="last_result" style="font-size: 16px; font-family: monospace;"></div>
    </div>
    
        <h3>上轉記錄</h3>
        <div id="last_result" style="font-size: 16px; font-family: monospace;"></div>
    </div>
</body>

</html>
